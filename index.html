<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Notas</title>
    <meta name="theme-color" content="#CC1919">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->

    <style>
        :root {
            --bg-color: #E5E5EA; /* Fondo gris claro exigido */
            --sidebar-color: #D1D1D6;
            --accent-red: #CC1919;
            --fan-coral: #DD6B66; /* Color coral exigido */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #1C1C1E;
            -webkit-tap-highlight-color: transparent;
            user-select: none; /* Mejor comportamiento táctil */
        }

        /* Editor Backgrounds */
        .bg-lined {
            background-color: #ffffff;
            background-image: repeating-linear-gradient(transparent, transparent 39px, #E5E5EA 39px, #E5E5EA 40px);
            background-attachment: local;
        }
        
        .bg-grid {
            background-color: #ffffff;
            background-size: 30px 30px;
            background-image: 
                linear-gradient(to right, #E5E5EA 1px, transparent 1px), 
                linear-gradient(to bottom, #E5E5EA 1px, transparent 1px);
            background-attachment: local;
        }
        
        .bg-dotted {
            background-color: #ffffff;
            background-image: radial-gradient(#AEAEB2 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            background-attachment: local;
        }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #C7C7CC; border-radius: 10px; }

        [contenteditable] { user-select: text; }
        [contenteditable]:empty:before {
            content: attr(placeholder);
            color: #9CA3AF;
            pointer-events: none;
            display: block;
        }
        
        .sidebar-text { transition: opacity 0.2s ease, width 0.2s ease; }

        input, textarea { user-select: text; }
        button:focus-visible, input:focus-visible { outline: 2px solid #CC1919; outline-offset: 2px; }

        /* Planta */
        @keyframes drop-fall { 0% { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(120px); opacity: 0; } }
        .drop-fx { position: absolute; top: 0; color: #3B82F6; animation: drop-fall .9s ease-in forwards; }
        @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
        .plant-sway { transform-origin: 100px 160px; animation: sway 5s ease-in-out infinite; }
        @media (prefers-reduced-motion: reduce) { .plant-sway, .drop-fx { animation: none; } }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex relative">

    <!-- Context Menu Flotante (Click Derecho / Long Press) -->
    <div id="note-context-menu" class="fixed hidden bg-[#656565]/95 backdrop-blur-md text-[#F2F2F7] w-48 rounded-xl shadow-2xl z-[100] flex-col py-2 text-[15px] font-medium border border-white/10" oncontextmenu="return false;">
        <button id="ctx-pin" onclick="ctxAction('pin')" class="px-5 py-2.5 text-left hover:bg-white/10 transition-colors w-full tracking-wide">Fijar arriba</button>
        <button onclick="ctxAction('dup')" class="px-5 py-2.5 text-left hover:bg-white/10 transition-colors w-full tracking-wide">Duplicar</button>
        <button onclick="ctxAction('del')" class="px-5 py-2.5 text-left hover:bg-white/10 transition-colors w-full tracking-wide text-[#FF8A84]">Eliminar</button>
    </div>

    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/20 z-40 hidden transition-opacity" onclick="toggleSidebar()"></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="bg-[#D1D1D6] h-full w-16 flex flex-col items-start py-6 z-50 transition-all duration-300 relative border-r border-[#C7C7CC] shrink-0 overflow-hidden">
        
        <button onclick="toggleSidebar()" class="w-16 h-10 flex flex-col justify-center items-center gap-1 mb-8 hover:bg-black/5 rounded-lg transition-colors shrink-0">
            <div class="w-5 h-0.5 bg-gray-800 rounded"></div>
            <div class="w-5 h-0.5 bg-gray-800 rounded"></div>
            <div class="w-5 h-0.5 bg-gray-800 rounded"></div>
        </button>

        <nav class="flex flex-col gap-6 w-full items-start px-3">
            <button onclick="navTo('notes')" class="flex items-center text-gray-800 hover:text-black w-full px-1 py-1 overflow-hidden group">
                <img src="home.png" alt="" class="w-8 h-8 object-contain shrink-0 transition-transform group-hover:scale-110">
                <span class="sidebar-text opacity-0 w-0 ml-0 group-hover:text-black font-medium whitespace-nowrap overflow-hidden">Todas las notas</span>
            </button>

            <button class="flex items-center text-gray-800 w-full px-1 py-1 overflow-hidden">
                <img src="shared.png" alt="" class="w-8 h-8 object-contain shrink-0 transition-transform group-hover:scale-110">
                <span class="sidebar-text opacity-0 w-0 ml-0 font-medium whitespace-nowrap overflow-hidden">Notas compartidas</span>
            </button>

            <button onclick="navTo('calendar')" class="flex items-center text-gray-800 hover:text-black w-full px-1 py-1 overflow-hidden">
                <img src="calendar.png" alt="" class="w-8 h-8 object-contain shrink-0 transition-transform group-hover:scale-110">
                <span class="sidebar-text opacity-0 w-0 ml-0 font-medium whitespace-nowrap overflow-hidden">Calendario</span>
            </button>

            <button onclick="navTo('plant')" class="flex items-center text-gray-800 hover:text-black w-full px-1 py-1 overflow-hidden">
                <img src="plant.png" alt="" class="w-8 h-8 object-contain shrink-0">
                <span class="sidebar-text opacity-0 w-0 ml-0 font-medium whitespace-nowrap overflow-hidden">Mi planta</span>
            </button>

            <div class="w-8 h-[1px] bg-gray-400 my-1 mx-2 shrink-0"></div>

            <!-- Contenedor dinámico de carpetas (Inicia vacío) -->
            <div id="sidebar-folders" class="flex flex-col gap-6 w-full items-start"></div>

            <div class="w-8 h-[1px] bg-gray-400 my-1 mx-2 shrink-0"></div>

            <button class="flex items-center text-gray-800 w-full px-1 py-1 overflow-hidden">
                <img src="trash.png" alt="" class="w-8 h-8 object-contain shrink-0 transition-transform group-hover:scale-110">
                <span class="sidebar-text opacity-0 w-0 ml-0 font-medium whitespace-nowrap overflow-hidden">Papelera</span>
            </button>
        </nav>

        <div class="mt-auto w-full px-3">
            <button class="flex items-center text-gray-800 w-full px-1 py-1 overflow-hidden">
                <img src="settings.png" alt="" class="w-8 h-8 object-contain shrink-0 transition-transform group-hover:scale-110">
                <span class="sidebar-text opacity-0 w-0 ml-0 font-medium whitespace-nowrap overflow-hidden">Ajustes</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto relative bg-[#E5E5EA]">
        
        <!-- Home: All Notes -->
        <div id="view-notes" class="h-full flex flex-col p-6 max-w-4xl mx-auto hidden">
            <header class="flex items-end justify-between mb-8 pb-2">
                <div class="relative">
                    <h1 class="text-2xl font-bold text-black tracking-tight">Todas las notas</h1>
                    <div class="absolute -bottom-2 left-0 w-full h-[2px] bg-black"></div>
                </div>
                <div class="flex items-center gap-3 text-gray-700">
                    <button onclick="toggleSearch()" aria-label="Buscar" class="hover:text-black"><img src="search.png" alt="" class="w-6 h-6 object-contain"></button>
                    <button onclick="toggleGridView()" class="hover:text-black"><img id="grid-toggle-icon" src="view.png" alt="" class="w-6 h-6 object-contain"><img id="grid-toggle-list" src="list.png" alt="" class="w-6 h-6 object-contain hidden"></button>
                    <div class="relative">
                        <button onclick="toggleMoreMenu(event)" class="hover:text-black"><img src="options.png" alt="" class="h-7 w-auto object-contain"></button>
                        <div id="more-menu" class="absolute right-0 top-full mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 hidden z-50 flex flex-col py-2">
                            <button onclick="promptCreateFolder()" class="px-4 py-2 text-left text-gray-800 hover:bg-gray-50 flex items-center gap-2 font-medium">
                                <img src="folder-plus.png" alt="" class="w-5 h-5 object-contain"> Crear carpeta
                            </button>
                        </div>
                    </div>
                </div>
            </header>
            <div id="search-bar" class="hidden mb-4 px-1">
                <input id="search-input" type="search" placeholder="Buscar notas" oninput="searchQuery=this.value.trim().toLowerCase();renderNotesList()" class="w-full bg-white rounded-full px-5 py-2.5 outline-none shadow-sm border border-gray-100">
            </div>
            <div id="notes-container" class="flex flex-col gap-4 pb-28 px-1"></div>
        </div>

        <!-- Editor View -->
        <div id="view-editor" class="h-full flex flex-col p-4 md:p-6 max-w-4xl mx-auto hidden">
            <header class="flex items-center justify-between mb-4 gap-4">
                <button onclick="navTo('notes')" class="text-gray-800 hover:bg-black/5 p-2 rounded-lg font-medium flex items-center gap-1">
                    <img src="back.png" alt="" class="w-6 h-6 object-contain">
                </button>
                <div class="flex-1 flex justify-center">
                    <input type="text" id="editor-title" placeholder="Título" class="bg-white rounded-full px-6 py-2 w-full max-w-sm text-center font-medium shadow-sm outline-none border border-gray-100 focus:ring-2 ring-gray-200">
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="cycleBackground()" class="text-gray-600 hover:text-black p-2 bg-black/5 rounded-full"><img src="wand.png" alt="" class="w-5 h-5 object-contain"></button>
                    <button class="text-gray-800 hover:text-black p-2"><img src="options.png" alt="" class="h-7 w-auto object-contain"></button>
                </div>
            </header>
            <div class="flex-1 flex flex-col bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative pb-16">
                <div id="editor-content" contenteditable="true" placeholder="Empieza a escribir..." class="flex-1 w-full outline-none p-6 text-gray-800 leading-loose rounded-b-2xl transition-all duration-300 min-h-[50vh] bg-white"></div>
            </div>
        </div>

        <!-- Checklist View -->
        <div id="view-checklist" class="hidden h-full flex flex-col p-4 md:p-6 max-w-4xl mx-auto">
            <header class="flex items-center justify-between mb-8 gap-4">
                <button onclick="navTo('notes')" class="text-gray-800 hover:bg-black/5 p-2 rounded-lg font-medium flex items-center gap-1">
                    <img src="back.png" alt="" class="w-6 h-6 object-contain">
                </button>
                <div class="flex-1 flex justify-center">
                    <input type="text" id="checklist-title" placeholder="Título" class="bg-white rounded-full px-6 py-2 w-full max-w-sm text-center font-medium shadow-sm outline-none border border-gray-100">
                </div>
                <button class="text-gray-800 p-2"><img src="options.png" alt="" class="h-7 w-auto object-contain"></button>
            </header>
            
            <div id="checklist-items" class="flex flex-col gap-3 pb-24"></div>

            <div class="fixed bottom-10 left-0 w-full flex justify-center pointer-events-none z-10 pl-16">
                <button onclick="addChecklistItem()" class="w-12 h-12 bg-[#CC1919] text-white rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition-transform pointer-events-auto">
                    <img src="plus-white.png" alt="" class="w-6 h-6 object-contain">
                </button>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="view-calendar" class="h-full flex flex-col p-6 max-w-lg mx-auto relative overflow-y-auto">
            <header class="flex items-end justify-between mb-8 pb-2">
                <div class="relative">
                    <h1 class="text-2xl font-bold text-black tracking-tight">Calendario</h1>
                    <div class="absolute -bottom-2 left-0 w-full h-[2px] bg-black"></div>
                </div>
                <div class="flex items-center gap-3 text-gray-700">
                    <button class="hover:text-black"><img src="search.png" alt="" class="w-6 h-6 object-contain"></button>
                    <button class="hover:text-black"><img src="view.png" alt="" class="w-6 h-6 object-contain"></button>
                    <button class="hover:text-black"><img src="options.png" alt="" class="h-7 w-auto object-contain"></button>
                </div>
            </header>

            <div class="w-full bg-[#B3B3B3] rounded-full py-2 flex justify-between items-center shadow-inner mb-6 px-4">
                <button onclick="changeMonth(-1)" class="text-gray-700 hover:text-black p-1"><img src="back.png" alt="" class="w-5 h-5 object-contain"></button>
                <span id="cal-month-year" class="font-medium text-gray-800 tracking-wide capitalize">Octubre 2026</span>
                <button onclick="changeMonth(1)" class="text-gray-700 hover:text-black p-1"><img src="next.png" alt="" class="w-5 h-5 object-contain"></button>
            </div>

            <!-- Zona Swipe Calendario -->
            <div id="calendar-swipe-zone" class="w-full pb-4 border-b border-[#D1D1D6] mb-6">
                <div class="grid grid-cols-7 gap-y-6 text-center text-sm font-medium mb-4">
                    <div class="text-gray-800">L</div><div class="text-gray-800">M</div><div class="text-gray-800">X</div>
                    <div class="text-gray-800">J</div><div class="text-gray-800">V</div><div class="text-gray-800">S</div><div class="text-gray-800">D</div>
                </div>
                <div id="cal-grid" class="grid grid-cols-7 gap-y-4 text-center text-sm font-medium"></div>
            </div>

            <!-- Recordatorios -->
            <div id="cal-reminders" class="flex flex-col gap-3 pb-32"></div>
        </div>

        <!-- Planta: riega estudiando -->
        <div id="view-plant" class="hidden h-full flex flex-col p-6 max-w-lg mx-auto overflow-y-auto">
            <header class="flex items-end justify-between mb-8 pb-2">
                <div class="relative">
                    <h1 class="text-2xl font-bold text-black tracking-tight">Mi planta</h1>
                    <div class="absolute -bottom-2 left-0 w-full h-[2px] bg-black"></div>
                </div>
            </header>

            <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 p-5 flex flex-col items-center mb-4">
                <div id="plant-art" class="relative w-48 h-52"></div>
                <div id="plant-stage" class="text-lg font-bold text-gray-900 mt-1"></div>
                <div id="plant-status" class="text-sm text-gray-500 text-center mt-1 min-h-[1.25rem]"></div>
                <div class="w-full mt-4">
                    <div class="h-2 rounded-full bg-[#E5E5EA] overflow-hidden"><div id="plant-bar" class="h-full bg-[#3E9B54] rounded-full transition-all duration-500" style="width:0%"></div></div>
                    <div id="plant-next" class="text-xs text-gray-400 mt-1.5 text-center"></div>
                </div>
            </div>

            <div class="bg-white rounded-[28px] shadow-sm border border-gray-100 p-5 mb-4">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="text-xs text-gray-400 font-medium">Sesión de estudio</div>
                        <div id="plant-timer" class="text-4xl font-bold tabular-nums tracking-tight text-gray-900">00:00:00</div>
                    </div>
                    <button id="plant-toggle" onclick="togglePlantTimer()" aria-label="Iniciar o pausar" class="w-16 h-16 rounded-full bg-[#CC1919] text-white shadow-lg shadow-red-900/30 flex items-center justify-center hover:scale-105 transition-transform">
                        <img id="plant-toggle-icon" src="play.png" alt="" class="w-8 h-8 object-contain">
                    </button>
                </div>
                <div class="text-sm text-gray-500 mt-3">Hoy has estudiado <span id="plant-today" class="font-semibold text-gray-800">0 min</span></div>
            </div>

            <button id="plant-water" onclick="waterPlant()" class="w-full rounded-[24px] py-4 bg-[#1A1A1A] text-white font-bold text-lg flex items-center justify-center gap-2 shadow-md transition-all">
                <img src="drop-white.png" alt="" class="w-6 h-6 object-contain"><span id="plant-water-label">Regar</span>
            </button>
            <p class="text-xs text-gray-400 text-center mt-3 pb-8">Cada hora de estudio te da un riego. Riega para que la planta crezca.</p>
        </div>
    </main>

    <!-- Área de Botones Flotantes y Menú Abanico (Fan Menu) -->
    <div id="fab-container" class="fixed bottom-6 right-6 z-40 w-16 h-16 pointer-events-auto">
        
        <!-- Menú Coral SVG Matemáticamente Exacto de 256x256 -->
        <div id="fan-menu" class="absolute bottom-2 right-2 w-64 h-64 origin-bottom-right transition-all duration-300 scale-0 opacity-0 pointer-events-none hidden">
            <!-- Arco con centro desplazado. Radio R=192. Inicio (32,224) a (224,32) -->
            <svg viewBox="0 0 256 256" class="absolute inset-0 w-full h-full pointer-events-none">
                <path d="M 32 224 A 192 192 0 0 1 224 32" stroke="var(--fan-coral)" stroke-width="48" stroke-linecap="round" fill="none" class="pointer-events-auto"></path>
            </svg>

            <!-- Iconos anclados exactamente a los ángulos trigonométricos (0°, 30°, 60°, 90°) -->
            <button onclick="createNewNote('text')" class="absolute text-[#1C1C1E] hover:scale-110 transition-transform pointer-events-auto z-10 translate-x-1/2 translate-y-1/2" style="bottom: 32px; right: 224px;" title="Nota">
                <img src="note.png" alt="" class="w-8 h-8 object-contain">
            </button>
            <button onclick="openTableModal()" class="absolute text-[#1C1C1E] hover:scale-110 transition-transform pointer-events-auto z-10 translate-x-1/2 translate-y-1/2" style="bottom: 128px; right: 198.27px;" title="Tabla">
                <img src="table.png" alt="" class="w-8 h-8 object-contain">
            </button>
            <button onclick="createNewNote('checklist')" class="absolute text-[#1C1C1E] hover:scale-110 transition-transform pointer-events-auto z-10 translate-x-1/2 translate-y-1/2" style="bottom: 198.27px; right: 128px;" title="Checklist">
                <img src="checklist.png" alt="" class="w-8 h-8 object-contain">
            </button>
            <button onclick="navTo('calendar')" class="absolute text-[#1C1C1E] hover:scale-110 transition-transform pointer-events-auto z-10 translate-x-1/2 translate-y-1/2" style="bottom: 224px; right: 32px;" title="Recordatorio">
                <img src="bell.png" alt="" class="w-8 h-8 object-contain">
            </button>
        </div>

        <!-- FAB Principal (Lápiz) -->
        <button id="main-fab" onclick="handleFabClick(event)" class="absolute bottom-0 right-0 w-16 h-16 bg-[#CC1919] text-white rounded-full shadow-xl shadow-red-900/30 flex items-center justify-center hover:scale-105 transition-transform z-20 pointer-events-auto hidden">
            <img id="main-fab-pencil" src="pencil.png" alt="" class="w-8 h-8 object-contain"><img id="main-fab-icon" src="check.png" alt="" class="w-8 h-8 object-contain hidden">
        </button>

        <!-- FAB Específico de Calendario (+) -->
        <button id="cal-add-fab" onclick="addReminder()" class="absolute bottom-0 right-0 w-16 h-16 bg-[#CC1919] text-white rounded-full shadow-xl shadow-red-900/30 flex items-center justify-center hover:scale-105 transition-transform z-20 pointer-events-auto">
            <img src="plus-white.png" alt="" class="w-8 h-8 object-contain">
        </button>
    </div>

    <!-- Modal para Configurar Tablas -->
    <div id="table-modal" class="fixed inset-0 bg-black/30 z-50 items-center justify-center p-4 backdrop-blur-sm hidden">
        <div class="bg-[#E2E2E6] p-6 rounded-2xl shadow-2xl w-full max-w-xs relative border border-gray-300">
            <div class="relative mb-6">
                <h2 class="text-lg font-semibold text-gray-800">Tabla</h2>
                <div class="absolute -bottom-1 left-0 w-3/4 h-[1px] bg-gray-500"></div>
            </div>
            <div class="flex items-center justify-between mb-4">
                <span class="text-gray-700">Filas</span>
                <div class="flex items-center gap-3">
                    <button onclick="adjTable('row', -1)" class="text-gray-800"><img src="back.png" alt="" class="w-5 h-5 object-contain"></button>
                    <div class="bg-white w-10 text-center py-0.5 rounded-full text-sm font-medium" id="val-rows">2</div>
                    <button onclick="adjTable('row', 1)" class="text-gray-800"><img src="next.png" alt="" class="w-5 h-5 object-contain"></button>
                </div>
            </div>
            <div class="flex items-center justify-between mb-8">
                <span class="text-gray-700">Columnas</span>
                <div class="flex items-center gap-3">
                    <button onclick="adjTable('col', -1)" class="text-gray-800"><img src="back.png" alt="" class="w-5 h-5 object-contain"></button>
                    <div class="bg-white w-10 text-center py-0.5 rounded-full text-sm font-medium" id="val-cols">2</div>
                    <button onclick="adjTable('col', 1)" class="text-gray-800"><img src="next.png" alt="" class="w-5 h-5 object-contain"></button>
                </div>
            </div>
            <div class="flex justify-end mt-2">
                <button onclick="closeTableModal()" class="mr-4 text-gray-500 font-medium">Cancelar</button>
                <button onclick="insertTable()" class="bg-[#CC1919] text-white px-5 py-1.5 rounded-full font-medium">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal para Crear Carpeta (Estilo exacto de la imagen) -->
    <div id="folder-modal" class="fixed inset-0 bg-black/40 z-50 items-center justify-center p-4 backdrop-blur-sm hidden" onclick="if(event.target===this) closeFolderModal()">
        <div class="bg-[#5D5D5D] p-6 rounded-3xl shadow-2xl w-full max-w-[300px] relative border border-gray-500">
            <input type="text" id="folder-name-input" placeholder="Nombre" class="w-full bg-transparent border-b border-white text-white placeholder-gray-300 outline-none text-lg mb-6 pb-2">
            <div class="flex items-center gap-4">
                <div class="bg-white rounded-full px-3 py-2 flex items-center gap-2 flex-1 justify-between shadow-inner">
                    <button onclick="selectFolderColor('#CC1919')" data-color="#CC1919" class="folder-color-btn w-5 h-5 rounded-full bg-[#CC1919] ring-2 ring-offset-1 ring-transparent transition-all"></button>
                    <button onclick="selectFolderColor('#F59E0B')" data-color="#F59E0B" class="folder-color-btn w-5 h-5 rounded-full bg-[#F59E0B] ring-2 ring-offset-1 ring-transparent transition-all"></button>
                    <button onclick="selectFolderColor('#22C55E')" data-color="#22C55E" class="folder-color-btn w-5 h-5 rounded-full bg-[#22C55E] ring-2 ring-offset-1 ring-transparent transition-all"></button>
                    <button onclick="selectFolderColor('#3B82F6')" data-color="#3B82F6" class="folder-color-btn w-5 h-5 rounded-full bg-[#3B82F6] ring-2 ring-offset-1 ring-transparent transition-all"></button>
                    <button onclick="selectFolderColor('#1C1C1E')" data-color="#1C1C1E" class="folder-color-btn w-5 h-5 rounded-full bg-[#1C1C1E] ring-2 ring-offset-1 ring-transparent transition-all"></button>
                </div>
                <button onclick="confirmCreateFolder()" class="bg-[#CC1919] text-white px-5 py-2 rounded-xl font-bold shadow-md hover:bg-red-700 transition-colors">OK</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // --- Utilidades ---
        const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const plain = html => new DOMParser().parseFromString(html || '', 'text/html').body.textContent || '';
        const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

        // --- Estado General ---
        let notes = [];
        let folders = [];
        let currentView = 'notes';
        let isSidebarOpen = false;
        let isFanMenuOpen = false;
        let isGridView = false;
        let isMoreMenuOpen = false;
        let selectedFolderColor = '#CC1919';
        let ctxNoteId = null;
        let searchQuery = '';
        let blockNoteClick = false; // Bloqueo anti-toque accidental al abrir menús
        
        let currentNote = { id: null, type: 'text', title: '', content: '', items: [], background: 'none' };

        const TODAY = new Date();
        let calDate = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1); 
        let selectedDate = new Date(TODAY.getTime()); 

        // --- Inicialización y Guardado Local ---
        function initApp() {
            const localData = localStorage.getItem('figma_notes_v3');
            if(localData) notes = JSON.parse(localData);
            
            const localFolders = localStorage.getItem('figma_folders_v2');
            if(localFolders) folders = JSON.parse(localFolders);
            
            loadPlant();
            renderNotesList();
            renderSidebarFolders();
            initCalendarSwipe();
            navTo('notes');

            // Autoguardado: no se pierde nada si se cierra la app a medias
            const auto = debounce(() => {
                if (currentNote.id && (currentView === 'editor' || currentView === 'checklist')) saveCurrentNote(true);
            }, 700);
            ['editor-title', 'editor-content', 'checklist-title', 'checklist-items'].forEach(id => {
                const el = document.getElementById(id);
                el.addEventListener('input', auto);
                el.addEventListener('click', auto);
            });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && currentNote.id && (currentView === 'editor' || currentView === 'checklist')) saveCurrentNote(true);
            });

            setInterval(() => { if (currentView === 'plant') renderPlantTimer(); }, 1000);
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        function saveLocal() { localStorage.setItem('figma_notes_v3', JSON.stringify(notes)); }
        function saveFoldersLocal() { localStorage.setItem('figma_folders_v2', JSON.stringify(folders)); }

        // --- Sidebar y Menús ---
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const texts = document.querySelectorAll('.sidebar-text');
            
            if (isSidebarOpen) {
                sidebar.classList.remove('w-16');
                sidebar.classList.add('w-64', 'shadow-2xl');
                overlay.classList.remove('hidden');
                setTimeout(() => {
                    texts.forEach(t => {
                        t.classList.remove('w-0', 'ml-0');
                        t.classList.add('w-auto', 'ml-4', 'opacity-100');
                    });
                }, 150);
            } else {
                sidebar.classList.remove('w-64', 'shadow-2xl');
                sidebar.classList.add('w-16');
                overlay.classList.add('hidden');
                texts.forEach(t => {
                    t.classList.remove('w-auto', 'ml-4', 'opacity-100');
                    t.classList.add('opacity-0');
                    setTimeout(() => t.classList.add('w-0', 'ml-0'), 200);
                });
            }
        }

        function toggleGridView() {
            isGridView = !isGridView;
            document.getElementById('grid-toggle-icon').classList.toggle('hidden', isGridView);
            document.getElementById('grid-toggle-list').classList.toggle('hidden', !isGridView);
            renderNotesList();
        }

        function toggleMoreMenu(e) {
            if (e) e.stopPropagation();
            isMoreMenuOpen = !isMoreMenuOpen;
            document.getElementById('more-menu').classList.toggle('hidden', !isMoreMenuOpen);
        }

        // --- Context Menu Flotante (Long Press / Click Derecho) ---
        window.showContextMenu = function(id, x, y) {
            blockNoteClick = true; // Previene que se abra la nota accidentalmente
            ctxNoteId = id;
            const cn = notes.find(x => x.id === id);
            document.getElementById('ctx-pin').textContent = cn && cn.pinned ? 'Quitar fijado' : 'Fijar arriba';
            const menu = document.getElementById('note-context-menu');
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            
            // Cálculos para evitar que se salga de la pantalla
            let posX = x;
            let posY = y;
            if (posX + 200 > window.innerWidth) posX = window.innerWidth - 200;
            if (posY + 250 > window.innerHeight) posY = window.innerHeight - 250;
            
            menu.style.left = `${posX}px`;
            menu.style.top = `${posY}px`;
            
            setTimeout(() => blockNoteClick = false, 300);
        }

        function hideContextMenu() {
            const ctxMenu = document.getElementById('note-context-menu');
            if(ctxMenu && !ctxMenu.classList.contains('hidden')) {
                ctxMenu.classList.add('hidden');
                ctxMenu.classList.remove('flex');
            }
        }

        // Cierre global de menús al tocar fuera
        document.addEventListener('click', (e) => {
            if(isFanMenuOpen && !e.target.closest('#fab-container')) closeFanMenu();
            if(isMoreMenuOpen && !e.target.closest('#more-menu')) toggleMoreMenu();
            if(!e.target.closest('#note-context-menu')) hideContextMenu();
        });

        // --- Carpetas ---
        function promptCreateFolder() {
            toggleMoreMenu();
            document.getElementById('folder-name-input').value = '';
            selectFolderColor('#CC1919');
            document.getElementById('folder-modal').classList.remove('hidden');
            document.getElementById('folder-modal').classList.add('flex');
        }

        function closeFolderModal() {
            document.getElementById('folder-modal').classList.add('hidden');
            document.getElementById('folder-modal').classList.remove('flex');
        }

        function selectFolderColor(color) {
            selectedFolderColor = color;
            document.querySelectorAll('.folder-color-btn').forEach(btn => {
                if(btn.dataset.color === color) {
                    btn.classList.replace('ring-transparent', 'ring-gray-400');
                    btn.classList.add('scale-125');
                } else {
                    btn.classList.replace('ring-gray-400', 'ring-transparent');
                    btn.classList.remove('scale-125');
                }
            });
        }

        function confirmCreateFolder() {
            const name = document.getElementById('folder-name-input').value.trim();
            if(name) {
                folders.push({ id: Date.now().toString(), name: name, color: selectedFolderColor });
                saveFoldersLocal();
                renderSidebarFolders();
                closeFolderModal();
            }
        }

        function renderSidebarFolders() {
            const container = document.getElementById('sidebar-folders');
            if(!container) return;
            container.innerHTML = '';
            folders.forEach(folder => {
                const textClasses = isSidebarOpen ? 'w-auto ml-4 opacity-100' : 'opacity-0 w-0 ml-0';
                container.innerHTML += `
                <button class="flex items-center text-gray-800 w-full px-1 py-1 overflow-hidden group">
                    <img src="folder-${folder.color.replace('#','').toLowerCase()}.png" alt="" onerror="this.onerror=null;this.src='folder.png'" class="w-8 h-8 object-contain shrink-0 transition-transform group-hover:scale-110">
                    <span class="sidebar-text ${textClasses} font-medium whitespace-nowrap overflow-hidden transition-all duration-200 group-hover:text-black">${esc(folder.name)}</span>
                </button>`;
            });
        }

        // --- Navegación ---
        function navTo(view) {
            if(currentNote.id && (currentView === 'editor' || currentView === 'checklist')) {
                saveCurrentNote();
            }
            ['notes', 'editor', 'checklist', 'calendar', 'plant'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            currentView = view;
            
            if(isSidebarOpen) toggleSidebar();
            closeFanMenu();
            updateFABState();

            if(view === 'plant') renderPlant();
            if(view === 'notes') renderNotesList();
            if(view === 'calendar') {
                renderCalendarGrid();
                renderReminders();
            }
        }

        // --- Renderizado de Notas y Eventos (Long Press) ---
        function renderNotesList() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';
            container.className = isGridView ? 'grid grid-cols-2 gap-4 pb-28 px-1' : 'flex flex-col gap-4 pb-28 px-1';

            const matches = n => !searchQuery || ((n.title || '') + ' ' + plain(n.content) + ' ' + (n.items || []).map(i => i.text).join(' ')).toLowerCase().includes(searchQuery);
            const visibleNotes = notes.filter(n => n.type !== 'reminder' && matches(n))
                .sort((a,b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updatedAt - a.updatedAt);

            if (visibleNotes.length === 0) {
                container.innerHTML = `<div class="${isGridView ? 'col-span-2 ' : ''}text-center text-gray-500 py-16"><img src="note.png" alt="" class="w-10 h-10 object-contain opacity-30 mx-auto mb-2"><p class="text-sm font-medium">${searchQuery ? 'Ninguna nota coincide con tu búsqueda.' : 'Aún no hay notas. Toca el lápiz para crear la primera.'}</p></div>`;
                return;
            }
            
            visibleNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = `bg-white rounded-[20px] p-5 shadow-sm border border-gray-100 cursor-pointer hover:shadow-md transition-shadow relative ${isGridView ? 'min-h-[160px]' : 'min-h-[120px]'} flex flex-col select-none`;
                
                let snippet = '';
                if(note.type === 'checklist') {
                    const done = note.items.filter(i => i.checked).length;
                    snippet = `<div class="text-sm text-gray-500 mt-2 flex items-center gap-1"><img src="checklist.png" alt="" class="w-4 h-4 object-contain"> ${done}/${note.items.length} completados</div>`;
                } else {
                    const cleanText = esc(plain((note.content || '').replace(/<\/(p|div|tr|br)>|<br\s*\/?>/gi, ' ')));
                    snippet = `<div class="text-[13px] text-gray-700 mt-2 line-clamp-4 leading-relaxed">${cleanText || '...'}</div>`;
                }
                
                const d = new Date(note.updatedAt);
                const dateStr = d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });

                card.innerHTML = `
                    <div class="text-xs text-gray-400 mb-1 font-medium flex items-center justify-between">${dateStr}${note.pinned ? '<img src="pin.png" alt="" class="w-4 h-4 object-contain">' : ''}</div>
                    ${note.title ? `<strong class="block text-base text-gray-900 truncate tracking-tight">${esc(note.title)}</strong>` : ''}
                    ${snippet}
                `;
                
                // Lógica de Pulsación Larga (Touch) y Clic Derecho
                let pressTimer;
                let isDragging = false;

                // Ordenador: Clic Derecho
                card.oncontextmenu = (e) => {
                    e.preventDefault();
                    showContextMenu(note.id, e.clientX, e.clientY);
                };

                // Ordenador: Clic mantenido
                card.onmousedown = (e) => {
                    if(e.button !== 0) return;
                    isDragging = false;
                    pressTimer = setTimeout(() => { showContextMenu(note.id, e.clientX, e.clientY); }, 500);
                };
                card.onmousemove = () => { isDragging = true; clearTimeout(pressTimer); };
                card.onmouseup = () => clearTimeout(pressTimer);

                // Móvil: Pulsación larga (Long press)
                card.ontouchstart = (e) => {
                    isDragging = false;
                    pressTimer = setTimeout(() => {
                        showContextMenu(note.id, e.touches[0].clientX, e.touches[0].clientY);
                        if(navigator.vibrate) navigator.vibrate(50);
                    }, 500);
                };
                card.ontouchmove = () => { isDragging = true; clearTimeout(pressTimer); };
                card.ontouchend = () => clearTimeout(pressTimer);

                // Apertura normal
                card.onclick = (e) => {
                    if (blockNoteClick) return; // Si acaba de abrirse el menú contextual, cancela el clic
                    if (!document.getElementById('note-context-menu').classList.contains('hidden')) return;
                    openNote(note.id);
                };

                container.appendChild(card);
            });
        }

        // --- Gestión de Notas (Crear, Abrir, Guardar) ---
        function createNewNote(type) {
            currentNote = { id: Date.now().toString(), type: type, title: '', content: '', items: type === 'checklist' ? [{ text: '', checked: false }] : [], background: 'none', updatedAt: Date.now() };
            if(type === 'checklist') {
                document.getElementById('checklist-title').value = '';
                renderChecklistEditor();
                navTo('checklist');
            } else {
                document.getElementById('editor-title').value = '';
                document.getElementById('editor-content').innerHTML = '';
                applyEditorBackground();
                navTo('editor');
            }
        }

        function openNote(id) {
            const n = notes.find(x => x.id === id);
            if(!n) return;
            currentNote = JSON.parse(JSON.stringify(n));
            if(currentNote.type === 'checklist') {
                document.getElementById('checklist-title').value = currentNote.title || '';
                renderChecklistEditor();
                navTo('checklist');
            } else {
                document.getElementById('editor-title').value = currentNote.title || '';
                document.getElementById('editor-content').innerHTML = currentNote.content || '';
                applyEditorBackground();
                navTo('editor');
            }
        }

        function saveCurrentNote(keepOpen) {
            if(!currentNote.id) return;
            let hasData = false;
            
            if (currentNote.type === 'text') {
                currentNote.title = document.getElementById('editor-title').value.trim();
                currentNote.content = document.getElementById('editor-content').innerHTML.trim();
                if(currentNote.title || currentNote.content) hasData = true;
            } else if (currentNote.type === 'checklist') {
                currentNote.title = document.getElementById('checklist-title').value.trim();
                const itemDivs = document.querySelectorAll('.checklist-item-row');
                currentNote.items = [];
                itemDivs.forEach(div => {
                    const input = div.querySelector('input').value.trim();
                    const isChecked = div.dataset.checked === 'true';
                    if(input) currentNote.items.push({ text: input, checked: isChecked });
                });
                if(currentNote.title || currentNote.items.length > 0) hasData = true;
            }

            if (hasData) {
                currentNote.updatedAt = Date.now();
                const idx = notes.findIndex(n => n.id === currentNote.id);
                if(idx > -1) notes[idx] = currentNote;
                else notes.push(currentNote);
                saveLocal();
            }
            if (!keepOpen) currentNote.id = null;
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveLocal();
            if (currentView === 'notes') renderNotesList();
            if (currentView === 'calendar') renderReminders();
        }

        // --- Vista Checklist ---
        function renderChecklistEditor() {
            const container = document.getElementById('checklist-items');
            container.innerHTML = '';
            if(currentNote.items.length === 0) currentNote.items.push({text:'', checked:false});
            
            currentNote.items.forEach((item) => {
                const div = document.createElement('div');
                div.className = "checklist-item-row bg-white rounded-[24px] p-4 flex items-center gap-4 shadow-sm border border-gray-100";
                div.dataset.checked = item.checked ? 'true' : 'false';
                const dot = item.checked ? '<div class="w-3 h-3 bg-[#CC1919] rounded-full"></div>' : '';
                
                div.innerHTML = `
                    <button onclick="toggleCheckRow(this)" class="w-7 h-7 rounded-full border-[3px] border-[#1C1C1E] flex items-center justify-center shrink-0 transition-all">${dot}</button>
                    <input type="text" class="flex-1 outline-none text-gray-800 text-lg font-medium bg-transparent" value="${esc(item.text)}" placeholder="...">
                    <button onclick="deleteCheckRow(this)" class="text-gray-300 hover:text-red-500 shrink-0 px-2 transition-colors"><img src="close.png" alt="" class="w-5 h-5 object-contain opacity-40 hover:opacity-100 transition-opacity"></button>
                `;
                container.appendChild(div);
            });
        }

        window.toggleCheckRow = function(btn) {
            const row = btn.closest('.checklist-item-row');
            const isChecked = row.dataset.checked === 'true';
            row.dataset.checked = !isChecked;
            btn.innerHTML = !isChecked ? '<div class="w-3 h-3 bg-[#CC1919] rounded-full"></div>' : '';
        }

        window.deleteCheckRow = function(btn) { btn.closest('.checklist-item-row').remove(); }

        window.addChecklistItem = function() {
            const container = document.getElementById('checklist-items');
            const div = document.createElement('div');
            div.className = "checklist-item-row bg-white rounded-[24px] p-4 flex items-center gap-4 shadow-sm border border-gray-100";
            div.dataset.checked = 'false';
            div.innerHTML = `
                <button onclick="toggleCheckRow(this)" class="w-7 h-7 rounded-full border-[3px] border-[#1C1C1E] flex items-center justify-center shrink-0 transition-all"></button>
                <input type="text" class="flex-1 outline-none text-gray-800 text-lg font-medium bg-transparent" placeholder="...">
                <button onclick="deleteCheckRow(this)" class="text-gray-300 hover:text-red-500 shrink-0 px-2 transition-colors"><img src="close.png" alt="" class="w-5 h-5 object-contain opacity-40 hover:opacity-100 transition-opacity"></button>
            `;
            container.appendChild(div);
            div.querySelector('input').focus();
        }

        // --- Vista Editor Texto (Fondos) ---
        function cycleBackground() {
            const bgs = ['none', 'lined', 'grid', 'dotted'];
            let idx = bgs.indexOf(currentNote.background);
            currentNote.background = bgs[(idx + 1) % bgs.length];
            applyEditorBackground();
        }

        function applyEditorBackground() {
            const ed = document.getElementById('editor-content');
            ed.className = 'flex-1 w-full outline-none p-6 text-gray-800 leading-loose rounded-b-2xl transition-all duration-300 min-h-[50vh]';
            if (currentNote.background === 'lined') ed.classList.add('bg-lined');
            else if (currentNote.background === 'grid') ed.classList.add('bg-grid');
            else if (currentNote.background === 'dotted') ed.classList.add('bg-dotted');
            else ed.classList.add('bg-white');
        }

        // --- Tablas Interactivas (+ Filas/Columnas) ---
        let tableRows = 2; let tableCols = 2;

        function openTableModal() {
            closeFanMenu();
            document.getElementById('table-modal').classList.remove('hidden');
            document.getElementById('table-modal').classList.add('flex');
        }
        function closeTableModal() {
            document.getElementById('table-modal').classList.add('hidden');
            document.getElementById('table-modal').classList.remove('flex');
        }
        function adjTable(type, delta) {
            if (type === 'row') tableRows = Math.max(1, Math.min(10, tableRows + delta));
            else tableCols = Math.max(1, Math.min(10, tableCols + delta));
            document.getElementById('val-rows').innerText = tableRows;
            document.getElementById('val-cols').innerText = tableCols;
        }
        function insertTable() {
            closeTableModal();
            if(currentView !== 'editor') createNewNote('text');
            document.getElementById('editor-content').focus();
            let html = `<div contenteditable="false" class="relative inline-block w-full my-6 pr-8 pb-8 group"><div class="overflow-x-auto w-full rounded-lg shadow-sm border border-gray-200 bg-white" contenteditable="true"><table class="w-full border-collapse table-fixed min-w-max"><tbody>`;
            for(let i=0; i<tableRows; i++) {
                html += '<tr>';
                for(let j=0; j<tableCols; j++) html += `<td class="border border-gray-300 p-3 min-w-[100px] outline-none hover:bg-gray-50"><br></td>`;
                html += '</tr>';
            }
            html += `</tbody></table></div><button contenteditable="false" onclick="window.addTableCol(this)" class="absolute top-1/2 right-0 -translate-y-1/2 w-6 h-6 bg-[#CC1919] text-white rounded-full flex items-center justify-center font-bold shadow-md opacity-50 hover:opacity-100 transition-opacity z-10">+</button><button contenteditable="false" onclick="window.addTableRow(this)" class="absolute bottom-0 left-1/2 -translate-x-1/2 w-6 h-6 bg-[#CC1919] text-white rounded-full flex items-center justify-center font-bold shadow-md opacity-50 hover:opacity-100 transition-opacity z-10">+</button></div><p><br></p>`;
            document.execCommand('insertHTML', false, html);
        }
        window.addTableCol = function(btn) {
            btn.parentElement.querySelectorAll('tr').forEach(tr => {
                const td = document.createElement('td');
                td.className = 'border border-gray-300 p-3 min-w-[100px] outline-none hover:bg-gray-50';
                td.innerHTML = '<br>';
                tr.appendChild(td);
            });
        };
        window.addTableRow = function(btn) {
            const table = btn.parentElement.querySelector('table');
            const cols = table.querySelector('tr').children.length;
            const tr = document.createElement('tr');
            for(let i=0; i<cols; i++) {
                const td = document.createElement('td');
                td.className = 'border border-gray-300 p-3 min-w-[100px] outline-none hover:bg-gray-50';
                td.innerHTML = '<br>';
                tr.appendChild(td);
            }
            table.querySelector('tbody').appendChild(tr);
        };

        // --- Lógica del Menú Abanico (Fan Menu) ---
        function updateFABState() {
            const mainFab = document.getElementById('main-fab');
            const calFab = document.getElementById('cal-add-fab');
            const fanMenu = document.getElementById('fan-menu');
            const icon = document.getElementById('main-fab-icon');
            if (currentView === 'plant') {
                mainFab.classList.add('hidden');
                fanMenu.classList.add('hidden');
                calFab.classList.add('hidden');
                return;
            }
            
            if (currentView === 'calendar') {
                mainFab.classList.add('hidden');
                fanMenu.classList.add('hidden');
                calFab.classList.remove('hidden');
            } else {
                mainFab.classList.remove('hidden');
                fanMenu.classList.remove('hidden');
                calFab.classList.add('hidden');
                const isNotes = currentView === 'notes';
                icon.className = 'w-8 h-8 object-contain' + (isNotes ? ' hidden' : '');
                document.getElementById('main-fab-pencil').classList.toggle('hidden', !isNotes);
            }
        }

        function handleFabClick(e) {
            e.stopPropagation();
            if (currentView === 'notes') toggleFanMenu();
            else navTo('notes'); 
        }

        function toggleFanMenu() {
            isFanMenuOpen = !isFanMenuOpen;
            const fan = document.getElementById('fan-menu');
            if (isFanMenuOpen) {
                fan.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                fan.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
            } else {
                fan.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                fan.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
            }
        }

        function closeFanMenu() {
            isFanMenuOpen = false;
            const fan = document.getElementById('fan-menu');
            fan.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
            fan.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
        }

        // --- Calendario e Interactividad (Octubre 2026) ---
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        function getFormatDateStr(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function renderCalendarGrid() {
            document.getElementById('cal-month-year').innerText = `${monthNames[calDate.getMonth()]} ${calDate.getFullYear()}`;
            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';

            const year = calDate.getFullYear();
            const month = calDate.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const startOffset = firstDay === 0 ? 6 : firstDay - 1; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const remDays = new Set(notes.filter(n => n.type === 'reminder').map(n => n.date));

            for (let i = 0; i < startOffset; i++) grid.innerHTML += `<div class="text-gray-400 py-1">${daysInPrevMonth - startOffset + i + 1}</div>`;
            for (let i = 1; i <= daysInMonth; i++) {
                if (year === selectedDate.getFullYear() && month === selectedDate.getMonth() && i === selectedDate.getDate()) {
                    grid.innerHTML += `<div class="relative flex justify-center items-center cursor-pointer" onclick="selectDate(${year}, ${month}, ${i})"><div class="bg-[#CC1919] text-white rounded w-7 h-7 flex items-center justify-center font-bold shadow-sm">${i}</div></div>`;
                } else {
                    grid.innerHTML += `<div class="relative text-gray-700 py-1 cursor-pointer hover:bg-gray-200 rounded transition-colors" onclick="selectDate(${year}, ${month}, ${i})">${i}${remDays.has(getFormatDateStr(new Date(year, month, i))) ? '<span class="absolute left-1/2 -translate-x-1/2 bottom-0 w-1 h-1 rounded-full bg-[#CC1919]"></span>' : ''}</div>`;
                }
            }
            const remaining = 42 - (startOffset + daysInMonth);
            for(let i=1; i<=remaining; i++) grid.innerHTML += `<div class="text-gray-400 py-1">${i}</div>`;
        }

        window.selectDate = function(y, m, d) {
            selectedDate = new Date(y, m, d);
            renderCalendarGrid();
            renderReminders();
        };

        function changeMonth(delta) {
            calDate.setMonth(calDate.getMonth() + delta);
            renderCalendarGrid();
        }

        function initCalendarSwipe() {
            const calView = document.getElementById('calendar-swipe-zone');
            let touchStartX = 0;
            calView.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
            calView.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].screenX;
                if (touchStartX - touchEndX > 50) changeMonth(1);
                else if (touchEndX - touchStartX > 50) changeMonth(-1);
            }, {passive: true});
        }

        function renderReminders() {
            const container = document.getElementById('cal-reminders');
            container.innerHTML = '';
            
            const dayReminders = notes.filter(n => n.type === 'reminder' && n.date === getFormatDateStr(selectedDate)).sort((a,b) => a.updatedAt - b.updatedAt);
            let html = `<h3 class="text-gray-800 text-sm font-semibold mb-2 ml-1 mt-2">${selectedDate.getDate()} de ${monthNames[selectedDate.getMonth()]} - Recordatorios</h3>`;
            
            if (dayReminders.length === 0) {
                html += `<div class="bg-white rounded-[24px] p-6 shadow-sm border border-gray-100 flex flex-col items-center justify-center text-center text-gray-400 min-h-[100px]"><img src="bell-off.png" alt="" class="w-8 h-8 object-contain opacity-30 mb-2"><p class="text-sm font-medium">No hay recordatorios.</p></div>`;
            } else {
                dayReminders.forEach(rem => {
                    html += `
                    <div class="bg-white rounded-[20px] p-4 shadow-sm border border-gray-100 flex gap-3 relative group items-start transition-shadow hover:shadow-md">
                        <div class="w-3 h-3 rounded-full bg-[#CC1919] mt-1.5 shrink-0 shadow-sm shadow-red-900/20"></div>
                        <div contenteditable="true" onblur="updateReminder('${rem.id}', this.innerText)" class="flex-1 outline-none min-h-[1.5rem] text-gray-800 font-medium whitespace-pre-wrap">${esc(rem.content)}</div>
                        <button onclick="deleteNote('${rem.id}')" class="text-gray-300 hover:text-[#CC1919] shrink-0 transition-colors ml-2"><img src="close.png" alt="" class="w-5 h-5 object-contain opacity-40 hover:opacity-100 transition-opacity"></button>
                    </div>`;
                });
            }
            container.innerHTML = html;
        }

        window.addReminder = function() {
            notes.push({ id: Date.now().toString(), type: 'reminder', date: getFormatDateStr(selectedDate), content: '', updatedAt: Date.now() });
            saveLocal();
            renderReminders();
            setTimeout(() => {
                const editables = document.getElementById('cal-reminders').querySelectorAll('[contenteditable="true"]');
                if(editables.length > 0) editables[editables.length - 1].focus();
            }, 50);
        };

        window.updateReminder = function(id, content) {
            const note = notes.find(n => n.id === id);
            if(note) {
                if(content.trim() === '') deleteNote(id);
                else { note.content = content.trim(); note.updatedAt = Date.now(); saveLocal(); }
            }
        };

        // --- Acciones del menú contextual y búsqueda ---
        window.ctxAction = function(a) {
            const id = ctxNoteId;
            hideContextMenu();
            const n = notes.find(x => x.id === id);
            if (!n) return;
            if (a === 'pin') n.pinned = !n.pinned;
            else if (a === 'dup') notes.push({ ...JSON.parse(JSON.stringify(n)), id: Date.now().toString(), title: n.title ? n.title + ' (copia)' : '', pinned: false, updatedAt: Date.now() });
            else if (a === 'del') { if (!confirm('¿Eliminar esta nota?')) return; notes = notes.filter(x => x.id !== id); }
            saveLocal();
            renderNotesList();
        };

        function toggleSearch() {
            const bar = document.getElementById('search-bar');
            const input = document.getElementById('search-input');
            bar.classList.toggle('hidden');
            if (bar.classList.contains('hidden')) { input.value = ''; searchQuery = ''; renderNotesList(); }
            else input.focus();
        }

        // --- Planta: cada hora de estudio = 1 riego ---
        const HOUR = 3600000;
        const PLANT_KEY = 'figma_plant_v1';
        const STAGES = [
            { name: 'Semilla', at: 0 }, { name: 'Brote', at: 1 }, { name: 'Plántula', at: 3 },
            { name: 'Planta joven', at: 6 }, { name: 'Planta con flor', at: 12 }, { name: 'Planta frondosa', at: 24 }
        ];
        let plant = { pendingMs: 0, watered: 0, startTs: null, lastWater: null, log: {} };

        function loadPlant() { try { Object.assign(plant, JSON.parse(localStorage.getItem(PLANT_KEY)) || {}); } catch (e) {} }
        function savePlant() { try { localStorage.setItem(PLANT_KEY, JSON.stringify(plant)); } catch (e) {} }
        function liveMs() { return plant.startTs ? Date.now() - plant.startTs : 0; }

        // Pasa el tiempo en curso al acumulado y al registro del día
        function bankStudy() {
            if (!plant.startTs) return;
            const now = Date.now(), ms = now - plant.startTs, k = getFormatDateStr(new Date());
            plant.pendingMs += ms;
            plant.log[k] = (plant.log[k] || 0) + ms;
            plant.startTs = now;
        }

        function togglePlantTimer() {
            if (plant.startTs) { bankStudy(); plant.startTs = null; }
            else plant.startTs = Date.now();
            savePlant();
            renderPlantTimer();
        }

        function fmtClock(ms) {
            const t = Math.floor(ms / 1000);
            return [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map(v => String(v).padStart(2, '0')).join(':');
        }
        function fmtMin(ms) {
            const m = Math.floor(ms / 60000);
            return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
        }

        window.waterPlant = function() {
            bankStudy();
            if (plant.pendingMs < HOUR) return;
            plant.pendingMs -= HOUR;
            plant.watered++;
            plant.lastWater = Date.now();
            savePlant();
            const art = document.getElementById('plant-art');
            for (let i = 0; i < 4; i++) {
                const d = document.createElement('img');
                d.src = 'drop.png';
                d.className = 'w-6 h-6 drop-fx';
                d.style.left = (30 + i * 28) + '%';
                d.style.animationDelay = (i * 0.12) + 's';
                art.appendChild(d);
                setTimeout(() => d.remove(), 1400);
            }
            setTimeout(renderPlant, 700);
            renderPlantTimer();
        };

        function flowerSVG(cx, cy, r) {
            let f = '';
            for (let a = 0; a < 6; a++) {
                const x = cx + Math.cos(a * Math.PI / 3) * r * 0.9, y = cy + Math.sin(a * Math.PI / 3) * r * 0.9;
                f += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r * 0.7).toFixed(1)}" fill="#CC1919"/>`;
            }
            return f + `<circle cx="${cx}" cy="${cy}" r="${(r * 0.55).toFixed(1)}" fill="#F5C542"/>`;
        }

        function plantSVG(stage, wilt) {
            const g = wilt ? '#8E9A6B' : '#3E9B54', g2 = wilt ? '#A3AE80' : '#5BBF72';
            const H = [0, 24, 48, 72, 92, 108][stage];
            let p = '';
            if (stage === 0) p += '<ellipse cx="100" cy="158" rx="8" ry="5" fill="#8B5E3C"/>';
            else {
                p += `<line x1="100" y1="162" x2="100" y2="${160 - H}" stroke="${g}" stroke-width="5" stroke-linecap="round"/>`;
                const n = stage * 2;
                for (let k = 0; k < n; k++) {
                    const side = k % 2 ? 1 : -1, y = 156 - H * (0.15 + 0.8 * k / Math.max(1, n - 1)), cx = 100 + side * 14;
                    p += `<ellipse cx="${cx}" cy="${y.toFixed(1)}" rx="14" ry="6" transform="rotate(${side * (wilt ? 38 : -25)} ${cx} ${y.toFixed(1)})" fill="${k % 3 ? g2 : g}"/>`;
                }
                if (stage < 4) p += `<ellipse cx="100" cy="${160 - H - 6}" rx="5" ry="10" fill="${g2}"/>`;
                if (stage >= 4) p += flowerSVG(100, 160 - H - 4, 11);
                if (stage === 5) {
                    p += `<path d="M100 ${160 - H * 0.55} Q80 ${160 - H * 0.65} 68 ${160 - H * 0.82}" stroke="${g}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
                    p += `<path d="M100 ${160 - H * 0.45} Q120 ${160 - H * 0.6} 132 ${160 - H * 0.78}" stroke="${g}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
                    p += flowerSVG(68, 160 - H * 0.82 - 3, 8) + flowerSVG(132, 160 - H * 0.78 - 3, 8);
                }
            }
            const body = wilt ? `<g transform="rotate(16 100 160)">${p}</g>` : `<g class="plant-sway">${p}</g>`;
            return `<svg viewBox="0 0 200 220" class="w-full h-full" role="img" aria-label="Planta: ${STAGES[stage].name}">
                ${body}
                <path d="M58 166 H142 L134 208 Q133 212 128 212 H72 Q67 212 66 208 Z" fill="#DD6B66"/>
                <rect x="52" y="152" width="96" height="18" rx="6" fill="#CC5A55"/>
                <ellipse cx="100" cy="153" rx="42" ry="3.5" fill="#5A3D2B"/>
            </svg>`;
        }

        function isWilted() { return plant.watered > 0 && plant.lastWater && (Date.now() - plant.lastWater > 72 * HOUR); }

        function renderPlant() {
            let stage = 0;
            STAGES.forEach((st, i) => { if (plant.watered >= st.at) stage = i; });
            const wilt = isWilted(), next = STAGES[stage + 1];
            const art = document.getElementById('plant-art');
            art.querySelectorAll('svg').forEach(el => el.remove());
            art.insertAdjacentHTML('afterbegin', plantSVG(stage, wilt));
            document.getElementById('plant-stage').textContent = STAGES[stage].name;
            document.getElementById('plant-status').textContent = wilt
                ? 'Lleva días sin agua. Estudia una hora y riégala.'
                : plant.watered === 0 ? 'Estudia una hora para el primer riego.' : `${plant.watered} ${plant.watered === 1 ? 'riego' : 'riegos'} en total`;
            const pct = next ? (plant.watered - STAGES[stage].at) / (next.at - STAGES[stage].at) * 100 : 100;
            document.getElementById('plant-bar').style.width = pct + '%';
            document.getElementById('plant-next').textContent = next
                ? `${next.at - plant.watered} ${next.at - plant.watered === 1 ? 'riego' : 'riegos'} para ser ${next.name.toLowerCase()}`
                : 'Tu planta ha crecido al máximo';
            renderPlantTimer();
        }

        function renderPlantTimer() {
            const total = plant.pendingMs + liveMs();
            const avail = Math.floor(total / HOUR);
            const today = (plant.log[getFormatDateStr(new Date())] || 0) + liveMs();
            document.getElementById('plant-timer').textContent = fmtClock(liveMs());
            document.getElementById('plant-today').textContent = fmtMin(today);
            const tg = document.getElementById('plant-toggle-icon'), want = plant.startTs ? 'pause.png' : 'play.png';
            if (!tg.src.endsWith(want)) tg.src = want;
            const btn = document.getElementById('plant-water');
            btn.disabled = avail < 1;
            btn.classList.toggle('opacity-40', avail < 1);
            document.getElementById('plant-water-label').textContent = avail >= 1
                ? `Regar (${avail} ${avail === 1 ? 'disponible' : 'disponibles'})`
                : `Faltan ${Math.ceil((HOUR - total % HOUR) / 60000)} min para el próximo riego`;
        }

        // Arranque
        window.onload = initApp;
    </script>
</body>
</html>
